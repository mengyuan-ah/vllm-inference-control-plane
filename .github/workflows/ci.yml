name: CPU checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Lint canonical source
        run: make lint
      - name: Test canonical CPU suite
        run: make test
      - name: Run CPU demo
        run: make demo
