[project]
name = "vllm-e11-offline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.14,<4", "transformers>=4.55,<5"]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.12,<0.17"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../../src", "../e10"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
