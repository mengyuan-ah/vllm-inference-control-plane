[project]
name = "vllm-e9-offline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.14,<4", "numpy>=2.3,<3", "transformers>=4.55,<5"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
