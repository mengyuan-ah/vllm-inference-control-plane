[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-inference-control-plane"
version = "0.1.0"
description = "Experimental SLO-aware control plane and measurement suite for vLLM replicas"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14,<4",
  "numpy>=2.3,<3",
  "transformers>=4.55,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<0.17",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC"]
ignore = ["E501"]
